<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>stackCRM — Login</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="app.css" />
  <link rel="stylesheet" href="dashboards.html"/>
</head>
<body>
  <div class="page">
    <div class="login-card" role="main">
      
      <div class="brand">
        <div class="logo" aria-hidden="true">
          <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect width="40" height="40" rx="10" fill="#0F8F6F"/>
            <path d="M12 20 L20 12 L28 20 L20 28 Z" stroke="#fff" stroke-width="2" fill="none"/>
            <circle cx="20" cy="20" r="3" fill="#fff"/>
          </svg>
        </div>
        <h1 class="product-name">stackCRM</h1>
        <p class="subtitle">Login to continue</p>
      </div>

      
      <div class="tabs" role="tablist" aria-label="Authentication mode">
        <button type="button" class="tab active" id="tab-login" role="tab" aria-selected="true" aria-controls="panel-login">Login</button>
        <button type="button" class="tab" id="tab-register" role="tab" aria-selected="false" aria-controls="panel-register">Register</button>
      </div>

      
      <div class="demo-box" id="demo-box">
        <div class="demo-header">
          <span class="demo-label">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"/></svg>
            
          </span>
          <button type="button" class="auto-fill-btn" id="auto-fill">Auto Fill</button>
        </div>
        <div class="demo-creds">
          <div><span>Email:</span> <code>admin@stackCRM.com</code></div>
          <div><span>Password:</span> <code>admin12345</code></div>
        </div>
      </div>

      
      <div class="notification" id="notification" role="alert" aria-live="polite" hidden></div>

      
      <form id="panel-login" class="form-panel active" role="tabpanel" aria-labelledby="tab-login" novalidate>
        <div class="field">
          <label for="login-email">Email Address</label>
          <div class="input-wrap">
            <span class="input-icon" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
            </span>
            <input type="email" id="login-email" name="email" placeholder="you@company.com" autocomplete="email" required />
          </div>
          <p class="field-error" id="login-email-error" hidden></p>
        </div>

        <div class="field">
          <label for="login-password">Password</label>
          <div class="input-wrap">
            <span class="input-icon" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
            </span>
            <input type="password" id="login-password" name="password" placeholder="Enter your password" autocomplete="current-password" required minlength="6" />
            <button type="button" class="toggle-password" id="toggle-login-password" aria-label="Show password">
              <svg class="eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="eye-closed" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" hidden><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
          </div>
          <p class="field-error" id="login-password-error" hidden></p>
        </div>

        <div class="form-row">
          <label class="checkbox-label">
            <input type="checkbox" id="remember-me" name="remember" />
            <span class="checkmark"></span>
            Remember me
          </label>
          <button type="button" class="link-btn" id="forgot-password">Forgot password?</button>
        </div>

        <button type="submit" class="btn-primary" id="login-btn">
          <span class="btn-text">Login</span>
          <span class="btn-spinner" hidden>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" stroke-opacity="0.25"/><path d="M12 2a10 10 0 019.95 9" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>
          </span>
        </button>
      </form>

      
      <form id="panel-register" class="form-panel" role="tabpanel" aria-labelledby="tab-register" hidden novalidate>
        <div class="field">
          <label for="reg-name">Full Name</label>
          <div class="input-wrap">
            <span class="input-icon" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            </span>
            <input type="text" id="reg-name" name="name" placeholder="Jane Doe" autocomplete="name" required />
          </div>
          <p class="field-error" id="reg-name-error" hidden></p>
        </div>

        <div class="field">
          <label for="reg-email">Email Address</label>
          <div class="input-wrap">
            <span class="input-icon" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
            </span>
            <input type="email" id="reg-email" name="email" placeholder="you@company.com" autocomplete="email" required />
          </div>
          <p class="field-error" id="reg-email-error" hidden></p>
        </div>

        <div class="field">
          <label for="reg-password">Password</label>
          <div class="input-wrap">
            <span class="input-icon" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
            </span>
            <input type="password" id="reg-password" name="password" placeholder="Min. 6 characters" autocomplete="new-password" required minlength="6" />
            <button type="button" class="toggle-password" id="toggle-reg-password" aria-label="Show password">
              <svg class="eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="eye-closed" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" hidden><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
          </div>
          <p class="field-error" id="reg-password-error" hidden></p>
        </div>

        <div class="field">
          <label for="reg-confirm">Confirm Password</label>
          <div class="input-wrap">
            <span class="input-icon" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
            </span>
            <input type="password" id="reg-confirm" name="confirm" placeholder="Repeat password" autocomplete="new-password" required minlength="6" />
          </div>
          <p class="field-error" id="reg-confirm-error" hidden></p>
        </div>

        <button type="submit" class="btn-primary" id="register-btn">
          <span class="btn-text">Create Account</span>
          <span class="btn-spinner" hidden>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" stroke-opacity="0.25"/><path d="M12 2a10 10 0 019.95 9" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>
          </span>
        </button>
      </form>

      <p class="footer-note">© 2026 stackCRM · Secure access for your team</p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
